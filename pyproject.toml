[project]
name = "hh-parser"
version = "0.1.0"
description = "HH.ru employer research parser with contact enrichment"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "rich>=13.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.30",
    "pandas>=2.0",
    "plotly>=5.18",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

[project.scripts]
hh-parser = "hh_parser.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
